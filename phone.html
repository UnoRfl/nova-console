<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06030d">
<title>Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&family=Inter:wght@400;500;600&display=swap">
<style>
  /* The desk panel's glass, in a pocket: same void, same accent, same type. */
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #c08cff; }
  :root {
    --void:#06030d; --ink:#f1eafc; --ink-mid:#b6a6d2; --ink-dim:#7f6ea0;
    --nova:#c08cff; --nova-mid:#8b46e8; --flare:#ff4fd8; --ok:#6ef2c0; --alert:#ff4d6d;
    --line:rgba(192,140,255,.16); --line-bright:rgba(192,140,255,.34); --glass:rgba(24,14,44,.5);
    --sheen:linear-gradient(160deg, rgba(255,255,255,.085), rgba(255,255,255,.012) 38%, rgba(255,255,255,0) 60%);
    --blur:blur(20px) saturate(150%); --ease:cubic-bezier(.22,.8,.24,1);
    --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --accent:#c08cff; transition:--accent .6s ease;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--void); color:var(--ink); font:15.5px/1.5 var(--body); -webkit-font-smoothing:antialiased; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow:hidden; }
  .field { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
           background:radial-gradient(120% 80% at 50% 20%, #140b28 0%, var(--void) 70%); }
  .field i { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; will-change:transform; }
  .field .a1 { width:90vmax; height:90vmax; left:-40vmax; top:-50vmax;
               background:radial-gradient(circle, color-mix(in srgb, var(--accent) 45%, transparent), transparent 62%);
               animation:d1 30s ease-in-out infinite alternate; }
  .field .a2 { width:80vmax; height:80vmax; right:-45vmax; bottom:-45vmax;
               background:radial-gradient(circle, rgba(139,70,232,.42), transparent 62%); animation:d2 36s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform:translate3d(14vmax,10vmax,0); } }
  @keyframes d2 { to { transform:translate3d(-12vmax,-9vmax,0); } }

  header, #log, footer { position:relative; z-index:1; }
  header { padding:16px 18px 12px; display:flex; align-items:center; gap:10px; }
  header b { font:300 19px var(--display); letter-spacing:.56em; text-shadow:0 0 22px color-mix(in srgb, var(--accent) 60%, transparent); }
  .pill { display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 12px; border-radius:999px;
          border:1px solid var(--line); background:var(--sheen), var(--glass);
          -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
          font:500 12px var(--body); color:var(--ink-mid); white-space:nowrap; }
  #status { margin-left:auto; color:var(--accent); border-color:color-mix(in srgb, var(--accent) 38%, transparent); }
  #status::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; box-shadow:0 0 9px currentColor; }
  button.pill { cursor:pointer; color:var(--ink); }
  button.pill[hidden] { display:none; }

  #log { flex:1; overflow-y:auto; padding:8px 16px 16px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .msg { max-width:86%; padding:11px 14px; border-radius:18px; white-space:pre-wrap; overflow-wrap:anywhere;
         animation:in .32s var(--ease) both; }
  @keyframes in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .me { align-self:flex-end; background:linear-gradient(160deg, rgba(192,140,255,.3), rgba(139,70,232,.22));
        border:1px solid var(--line-bright); border-bottom-right-radius:6px; }
  .nova { align-self:flex-start; background:var(--sheen), var(--glass); border:1px solid var(--line);
          -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-bottom-left-radius:6px;
          color:color-mix(in srgb, var(--nova) 78%, #fff); }
  .note { align-self:center; max-width:92%; font-size:12.5px; color:var(--ink-dim); text-align:center; background:none; padding:2px 8px; }
  /* Something she said at the desk on her own while he was away from it. */
  .notice { align-self:stretch; max-width:none; font-size:13.5px; color:#ffd9f5;
            background:rgba(255,79,216,.07); border:1px solid rgba(255,79,216,.26); border-radius:14px; }
  .notice small { display:block; font-size:11px; color:var(--ink-dim); margin-bottom:2px; letter-spacing:.06em; text-transform:uppercase; }

  footer { padding:10px 14px 14px; }
  .bar { display:flex; gap:6px; align-items:center; padding:6px; border-radius:999px; border:1px solid var(--line);
         background:var(--sheen), var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
         box-shadow:0 18px 50px -18px rgba(0,0,0,.75); transition:border-color .3s, box-shadow .3s; }
  .bar:focus-within { border-color:color-mix(in srgb, var(--accent) 55%, transparent); box-shadow:0 0 30px -12px var(--accent); }
  input { flex:1; min-width:0; padding:10px 6px; border:0; outline:none; background:transparent; color:var(--ink); font:inherit; }
  input::placeholder { color:var(--ink-dim); }
  .round { border:0; border-radius:50%; width:46px; height:46px; flex:none; display:grid; place-items:center; cursor:pointer;
           background:rgba(192,140,255,.12); color:var(--ink); transition:transform .2s var(--ease), background .25s; }
  .round:active { transform:scale(.92); }
  .round svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  #send { background:var(--nova); color:var(--void); box-shadow:0 0 22px -6px var(--nova); }
  #talk.rec { background:var(--ok); color:var(--void); box-shadow:0 0 26px -4px var(--ok); animation:pulse 1s ease-in-out infinite; }
  button:disabled { opacity:.45; }
  @keyframes pulse { 50% { transform:scale(1.1); } }

  #screen { position:fixed; inset:0; z-index:5; background:rgba(5,2,12,.8); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
            display:none; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #screen.on { display:flex; animation:in .28s var(--ease) both; }
  #screen .top { display:flex; gap:8px; padding:14px 16px; align-items:center; }
  #screen .top span { flex:1; color:var(--ink-dim); font-size:13px; }
  #screen .view { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
  #screen img { width:100%; display:block; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="field"><i class="a1"></i><i class="a2"></i></div>
<header><b>NOVA</b><span class="pill" id="status">connecting</span>
  <button class="pill" id="alertBtn" hidden>Alerts</button><button class="pill" id="screenBtn" hidden>Screen</button></header>
<div id="log">
  <div class="note" id="modeNote">Checking what this phone may do…</div>
</div>
<div id="screen" role="dialog" aria-label="PC screen">
  <div class="top"><span id="shotTime">PC screen</span>
    <button class="pill" id="shotRefresh">Refresh</button><button class="pill" id="shotClose">Close</button></div>
  <div class="view"><img id="shot" alt="The PC screen"></div>
</div>
<footer><div class="bar">
  <button class="round" id="talk" aria-label="Hold to talk"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <input id="text" placeholder="Ask Nova" autocomplete="off" enterkeyhint="send">
  <button class="round" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</div></footer>
<script>
  const TOKEN = "__NOVA_TOKEN__";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), text = $("text"), talk = $("talk"), send = $("send"), status = $("status");
  const root = document.documentElement;
  let busy = false, owner = false;

  function tint(c) { root.style.setProperty("--accent", c); }

  function add(cls, body) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = body;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  async function api(path, options) {
    const o = Object.assign({ headers: {} }, options || {});
    o.headers["X-Nova-Token"] = TOKEN;
    const r = await fetch(path, o);
    return r.json();
  }

  function speak(t) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    const v = speechSynthesis.getVoices().find(v => /en-GB/i.test(v.lang) && /female|libby|sonia|serena|kate|martha/i.test(v.name))
           || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  async function ask(prompt) {
    prompt = prompt.trim();
    if (!prompt || busy) return;
    busy = true; send.disabled = talk.disabled = true;
    add("me", prompt);
    const bubble = add("nova", "…");
    status.textContent = "thinking"; tint("#ff4fd8");
    try {
      const r = await api("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompt, channel: "phone" }) });
      const answer = r.error ? (r.detail || "Something went wrong.") : (r.text || "(no reply)");
      bubble.textContent = answer.replace(/::(CAD|MODEL|HOLO|BUILD)[\s\S]*$/, "").trim() || answer;
      if (!r.error) speak(bubble.textContent);
    } catch (e) {
      bubble.textContent = "I could not reach the PC.";
    }
    status.textContent = "ready"; tint("#c08cff");
    busy = false; send.disabled = talk.disabled = false;
  }

  send.addEventListener("click", () => { const v = text.value; text.value = ""; ask(v); });
  text.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send.click(); } });

  // Hold to talk: record, transcribe on the PC with Whisper, then ask.
  let rec = null, chunks = [];
  async function startRec() {
    if (busy || rec) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      rec = new MediaRecorder(stream);
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        talk.classList.remove("rec");
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        rec = null;
        if (blob.size < 2000) { status.textContent = "ready"; tint("#c08cff"); return; }
        status.textContent = "transcribing"; tint("#4dd2ff");
        try {
          const r = await fetch("/api/transcribe", { method: "POST", headers: { "X-Nova-Token": TOKEN }, body: blob });
          const out = await r.json();
          status.textContent = "ready"; tint("#c08cff");
          if (out.text) ask(out.text);
        } catch (e) { status.textContent = "could not transcribe"; tint("#ff4d6d"); }
      };
      rec.start();
      talk.classList.add("rec");
      status.textContent = "listening"; tint("#4dffc3");
    } catch (e) {
      add("note", "The microphone is not available here. Type instead.");
    }
  }
  function stopRec() { if (rec && rec.state === "recording") rec.stop(); }
  talk.addEventListener("pointerdown", (e) => { e.preventDefault(); startRec(); });
  talk.addEventListener("pointerup", stopRec);
  talk.addEventListener("pointerleave", stopRec);
  talk.addEventListener("contextmenu", (e) => e.preventDefault());

  // The PC screen, for Sir's own phone only (the bridge checks his Tailscale login).
  const screenBox = $("screen"), shot = $("shot");
  function loadShot() {
    $("shotTime").textContent = "loading…";
    shot.onload = () => { $("shotTime").textContent = "PC screen · " + new Date().toLocaleTimeString(); };
    shot.onerror = () => { $("shotTime").textContent = "could not load the screen"; };
    shot.src = "/api/phone/screen?token=" + encodeURIComponent(TOKEN) + "&t=" + Date.now();
  }
  $("screenBtn").addEventListener("click", () => { screenBox.classList.add("on"); loadShot(); });
  $("shotRefresh").addEventListener("click", loadShot);
  $("shotClose").addEventListener("click", () => screenBox.classList.remove("on"));

  // Notices: what she said at the desk on her own (a job finishing, a server
  // dropping, a reminder). Shown here while this page is open, and raised as
  // a phone notification if he allowed that. A page that is fully closed
  // gets nothing: the urgent ones also go to his Discord DMs for that.
  let seen = -1;
  const canNotify = "Notification" in window;
  async function pollNotices() {
    if (!owner) return;
    try {
      const r = await api("/api/notices?since=" + Math.max(0, seen));
      const first = seen < 0;
      seen = r.seq || 0;
      if (first) return;                       // do not replay the day on opening
      for (const n of r.notices || []) {
        const d = add("notice", "");
        const s = document.createElement("small");
        s.textContent = "Nova · " + new Date(n.at * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        d.append(s, document.createTextNode(n.text));
        if (canNotify && Notification.permission === "granted" && document.hidden) {
          try { new Notification("Nova", { body: n.text, tag: "nova-" + n.seq }); } catch (e) {}
        }
      }
    } catch (e) { /* offline for a moment */ }
  }
  $("alertBtn").addEventListener("click", async () => {
    const p = await Notification.requestPermission();
    $("alertBtn").hidden = p !== "default";
    add("note", p === "granted" ? "Alerts on. Keep this page open in the background to get them."
                                 : "Alerts were not allowed on this phone.");
  });

  api("/api/health").then(h => {
    owner = !!h.owner;
    status.textContent = h.error ? "offline" : "ready";
    $("modeNote").textContent = owner
      ? "Full control from here. Nothing is spoken at the desk."
      : "Away mode: Nova can look things up and answer, but will not change anything on the PC.";
    $("screenBtn").hidden = !owner;
    $("alertBtn").hidden = !(owner && canNotify && Notification.permission === "default");
    if (owner) { pollNotices(); setInterval(pollNotices, 20000); }
  }).catch(() => { status.textContent = "offline"; tint("#ff4d6d"); });
</script>
</body>
</html>
